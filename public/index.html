<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Signal — Live CRM Dispatch Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen" class="screen">
  <div class="login-wrap">
    <div class="login-card">
      <div class="brand brand-lg">
        <span class="signal-bars" data-state="idle"><i></i><i></i><i></i><i></i></span>
        <span class="brand-name">signal</span>
      </div>
      <p class="brand-tag">// live crm dispatch console</p>

      <form id="login-form">
        <label>email
          <input type="email" id="login-email" value="admin@example.com" required autocomplete="username" />
        </label>
        <label>password
          <input type="password" id="login-password" value="admin123" required autocomplete="current-password" />
        </label>
        <button type="submit" class="btn btn-primary btn-block">sign in →</button>
      </form>
      <div id="login-error" class="error-text"></div>

      <div class="seed-hint">
        <div class="seed-hint-title">// seeded accounts</div>
        <div class="seed-row"><span class="seed-role admin">admin</span><code>admin@example.com</code><code>admin123</code></div>
        <div class="seed-row"><span class="seed-role">user</span><code>alice@example.com</code><code>alice123</code></div>
        <div class="seed-row"><span class="seed-role">user</span><code>bob@example.com</code><code>bob123</code></div>
      </div>
    </div>
  </div>
</div>

<!-- APP SCREEN -->
<div id="app-screen" class="screen" style="display:none;">
  <aside class="sidebar">
    <div class="brand">
      <span class="signal-bars" data-state="idle" id="brand-bars"><i></i><i></i><i></i><i></i></span>
      <span class="brand-name">signal</span>
    </div>

    <nav class="nav">
      <button class="nav-item active" data-view="companies"><span class="nav-caret">&gt;</span>companies</button>
      <button class="nav-item" data-view="contacts"><span class="nav-caret">&nbsp;</span>contacts</button>
      <button class="nav-item" data-view="assignments"><span class="nav-caret">&nbsp;</span>assignments</button>
    </nav>

    <div class="sidebar-footer">
      <div class="who">
        <span class="who-avatar" id="me-avatar"></span>
        <span class="who-meta">
          <span class="who-name" id="me-name"></span>
          <span class="who-role" id="me-role"></span>
        </span>
      </div>
      <button id="logout-btn" class="btn btn-ghost btn-small btn-block">log out</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="conn-status" id="conn-status">
        <span class="signal-bars" data-state="idle" id="topbar-bars"><i></i><i></i><i></i><i></i></span>
        <span id="conn-label">connecting…</span>
      </div>

      <div class="topbar-actions">
        <button id="run-job-btn" class="btn btn-ghost btn-small" title="Admin only: run the background follow-up job now">
          run background job
        </button>

        <div class="bell-wrap">
          <button id="bell-btn" class="bell-btn" aria-label="Notifications">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span id="unread-badge" class="badge" style="display:none;">0</span>
          </button>
          <div id="notif-dropdown" class="notif-dropdown" style="display:none;">
            <div class="notif-dropdown-header">
              <span>notifications</span>
              <button id="mark-all-read" class="link-btn">mark all read</button>
            </div>
            <div id="notif-list" class="notif-list"></div>
          </div>
        </div>
      </div>
    </header>

    <!-- Signature element: live terminal-style dispatch log. Every assignment,
         reminder, and read receipt gets typed out here in real time — a
         literal, functional view of the "live notification" concept the
         whole app is built around. -->
    <div class="dispatch">
      <div class="dispatch-label">dispatch log</div>
      <div class="dispatch-log" id="dispatch-log"></div>
    </div>

    <section id="view-companies" class="view active">
      <div class="view-header">
        <h1>companies</h1>
        <button class="btn btn-primary btn-small" id="new-company-btn">+ new company</button>
      </div>
      <div id="companies-list" class="card-grid"></div>
    </section>

    <section id="view-contacts" class="view">
      <div class="view-header">
        <h1>contacts</h1>
        <button class="btn btn-primary btn-small" id="new-contact-btn">+ new contact</button>
      </div>
      <div id="contacts-list" class="card-grid"></div>
    </section>

    <section id="view-assignments" class="view">
      <div class="view-header">
        <h1>assignments</h1>
        <span class="admin-note" id="assignments-admin-note"></span>
      </div>
      <div id="assignments-table-wrap"></div>
    </section>
  </main>

  <nav class="mobile-nav">
    <div class="nav">
      <button class="nav-item active" data-view="companies"><span class="nav-caret">&gt;</span>companies</button>
      <button class="nav-item" data-view="contacts"><span class="nav-caret">&nbsp;</span>contacts</button>
      <button class="nav-item" data-view="assignments"><span class="nav-caret">&nbsp;</span>assignments</button>
    </div>
  </nav>
</div>

<!-- MODAL: new company -->
<div id="modal-company" class="modal-overlay" style="display:none;">
  <form class="modal" id="form-company">
    <h2>new company</h2>
    <label>name <input type="text" id="company-name" required /></label>
    <label>industry <input type="text" id="company-industry" /></label>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" data-close-modal>cancel</button>
      <button type="submit" class="btn btn-primary">create</button>
    </div>
  </form>
</div>

<!-- MODAL: new contact -->
<div id="modal-contact" class="modal-overlay" style="display:none;">
  <form class="modal" id="form-contact">
    <h2>new contact</h2>
    <label>name <input type="text" id="contact-name" required /></label>
    <label>email <input type="email" id="contact-email" /></label>
    <label>phone <input type="text" id="contact-phone" /></label>
    <label>company
      <select id="contact-company"></select>
    </label>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" data-close-modal>cancel</button>
      <button type="submit" class="btn btn-primary">create</button>
    </div>
  </form>
</div>

<!-- MODAL: assign -->
<div id="modal-assign" class="modal-overlay" style="display:none;">
  <form class="modal" id="form-assign">
    <h2>assign to user</h2>
    <input type="hidden" id="assign-entity-type" />
    <input type="hidden" id="assign-entity-id" />
    <div id="assign-entity-label" class="assign-entity-label"></div>
    <label>user
      <select id="assign-user"></select>
    </label>
    <label>role
      <select id="assign-role">
        <option value="OWNER">Owner</option>
        <option value="MANAGER">Manager</option>
        <option value="SALES_REP">Sales Rep</option>
        <option value="SUPPORT">Support</option>
      </select>
    </label>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" data-close-modal>cancel</button>
      <button type="submit" class="btn btn-primary">assign &amp; notify →</button>
    </div>
  </form>
</div>

<div id="toast-container" class="toast-container"></div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="app.js"></script>
</body>
</html>
